name: Loki work session

on:
  schedule:
    # Every 30 minutes. Loki checks UK time himself and sleeps 23:00-07:00 (night runs are tiny).
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

# Never run two sessions at once (protects memory).
concurrency:
  group: loki-session
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout brain
        uses: actions/checkout@v5
        with:
          path: loki

      - name: Checkout memory
        uses: actions/checkout@v5
        with:
          repository: lokistown/loki-memory
          token: ${{ secrets.LOKI_PAT }}
          path: loki-memory

      - name: Checkout website
        uses: actions/checkout@v5
        with:
          repository: lokistown/lokistown.github.io
          token: ${{ secrets.LOKI_PAT }}
          path: site

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Loki wakes up
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.LOKI_PAT }}
          LOKI_ADMIN_PASSWORD: ${{ secrets.LOKI_ADMIN_PASSWORD }}
          LOKI_WORKER_URL: ${{ vars.LOKI_WORKER_URL }}
          LOKI_WORKER_SECRET: ${{ secrets.LOKI_WORKER_SECRET }}
          LOKI_NTFY_TOPIC: ${{ secrets.LOKI_NTFY_TOPIC }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node loki/brain/session.js --memory loki-memory --site site

      # Runs even if the session crashed half-way, so every finished task is saved.
      - name: Save memory and publish website
        if: always()
        run: |
          git config --global user.name "Loki"
          git config --global user.email "loki@users.noreply.github.com"
          save() {
            dir="$1"; msg="$2"
            cd "$GITHUB_WORKSPACE/$dir"
            git add -A
            if git diff --cached --quiet; then echo "$dir: nothing new"; return 0; fi
            git commit -q -m "$msg"
            for i in 1 2 3; do
              git pull -q --rebase && git push -q && return 0
              sleep $((i * 5))
            done
            echo "::error::could not push $dir"; return 1
          }
          STAMP="$(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
          save loki-memory "Session $STAMP"
          save site "Loki's town update $STAMP"

      - name: Daily memory snapshot
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/loki-memory"
          TAG="snapshot-$(TZ=Europe/London date '+%Y-%m-%d')"
          if ! git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            git tag "$TAG" && git push -q origin "$TAG" && echo "Snapshot $TAG saved"
          fi

      # Loki's messages go out last, once his new pages are live (Pages needs ~1 minute to publish).
      - name: Send Loki's messages
        if: always()
        env:
          GH_TOKEN: ${{ secrets.LOKI_PAT }}
          LOKI_NTFY_TOPIC: ${{ secrets.LOKI_NTFY_TOPIC }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -s "$RUNNER_TEMP/loki-outbox.jsonl" ]; then sleep 90; node loki/brain/flush-notify.js; else echo "nothing to send"; fi
